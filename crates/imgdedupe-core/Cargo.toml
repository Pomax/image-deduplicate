[package]
name = "imgdedupe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["index", "review"]
# Walking a folder and writing the index.
index = []
# Matching, scoring and removing.
review = ["dep:trash"]
# The run log behind `--log`. Off here, and only turned on by `build --test`,
# so a normal build contains none of it.
logging = []

[dependencies]
anyhow.workspace = true
heic.workspace = true
image.workspace = true
jpeg-decoder.workspace = true
rayon.workspace = true
rusqlite.workspace = true
serde.workspace = true
trash = { workspace = true, optional = true }

[dev-dependencies]
# The tests encode JPEG fixtures and compare decoders. Neither ships.
image = { workspace = true, features = ["jpeg"] }
tempfile = "3"
zune-jpeg = "0.4"
