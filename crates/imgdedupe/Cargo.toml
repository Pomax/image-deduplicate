[package]
name = "imgdedupe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "imgdedupe"
path = "src/main.rs"

[features]
# The `--log` flag and everything it writes. Off unless the build script is
# given `--test`.
logging = ["imgdedupe-core/logging"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
directories = "5"
eframe.workspace = true
egui.workspace = true
fontdb = "0.22"
ttf-parser = "0.24"
imgdedupe-core = { path = "../imgdedupe-core", default-features = false, features = ["index", "review"] }
rfd.workspace = true
serde_json.workspace = true

# A Wayland compositor that draws no title bar leaves it to the client, and
# without this winit falls back to a frame whose buttons are plain rectangles.
# eframe reaches the feature only through winit's defaults, which are off here.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[dev-dependencies]
image.workspace = true
tempfile = "3"
