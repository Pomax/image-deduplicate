name: Release

# The three platforms build at the same time and their executables go out as one
# release: a tag makes a release of its own, and a push to main replaces the one
# called latest. A pull request builds all three and releases nothing.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            built: imgdedupe.exe
            asset: imgdedupe-windows.exe
          - os: macos-latest
            name: macos
            built: imgdedupe
            asset: imgdedupe-macos
          - os: ubuntu-latest
            name: linux
            built: imgdedupe
            asset: imgdedupe-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The window is drawn with OpenGL through X11 and Wayland, and the file
      # dialog goes through the desktop portal, which needs none of GTK. These
      # are the headers those link against.
      - name: What Linux needs to build a window
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev upx-ucl

      # The build packs the executable when upx is on the path and leaves it
      # alone when it is not, so this failing is not a reason to stop.
      - name: Something to pack it with
        if: matrix.name == 'windows'
        continue-on-error: true
        run: choco install upx --no-progress --yes

      - name: Build
        if: matrix.name == 'windows'
        shell: cmd
        run: build.bat

      - name: Build
        if: matrix.name != 'windows'
        shell: bash
        run: bash build.sh

      # The build leaves it at the root under one name on every platform, so
      # the name that says which platform it came from is put on here.
      - name: Name it for the platform it was built on
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    # A tag makes a release of its own. A push to main replaces the one called
    # latest, so the newest build of all three platforms is always downloadable
    # without waiting for somebody to tag something.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      # One release holding all three, made with the tool GitHub ships on its
      # own runners rather than somebody else's action.
      - name: Put the three of them out as one release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            title="$tag"
          else
            tag="latest"
            title="Latest build of main"
          fi

          # Made once and replaced afterwards, so the three assets of a release
          # are always from one build rather than from whichever job last
          # finished.
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$REPO" --target "$GITHUB_SHA" --title "$title"
          else
            gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "$title" --generate-notes
          fi

          gh release upload "$tag" --repo "$REPO" --clobber \
            built/imgdedupe-windows.exe \
            built/imgdedupe-macos \
            built/imgdedupe-linux
