name: Release

# Windows, macOS, and Linux build in parallel. The commit is tagged with the
# version in Cargo.toml and the three archives are committed to the `releases`
# branch, in a directory named after that version. Nothing runs until the
# version has been compared with the previous commit's: a push to main whose
# version did not change builds nothing and releases nothing.
#
# Not a GitHub release. Those attach two "Source code" archives of their own that
# cannot be turned off, and fold the downloads away on every release but the
# newest. A branch of directories is the whole history of builds, plainly, and
# every file in it has a permanent address.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      # Two commits, so this commit's version can be compared to the one before.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether the version changed
        id: decide
        run: sh .github/workflows/check-version.sh

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            built: imgdedupe.exe
          - os: macos-latest
            name: macos
            built: imgdedupe
          - os: ubuntu-latest
            name: linux
            built: imgdedupe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The window is drawn with OpenGL through X11 and Wayland, and the file
      # dialog goes through the desktop portal, which needs none of GTK. These
      # are the headers those link against.
      - name: What Linux needs to build a window
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev upx-ucl

      # The build packs the executable when upx is on the path and leaves it
      # alone when it is not, so this failing is not a reason to stop.
      - name: Something to pack it with
        if: matrix.name == 'windows'
        continue-on-error: true
        run: choco install upx --no-progress --yes

      - name: Build
        if: matrix.name == 'windows'
        shell: cmd
        run: scripts\build.bat

      - name: Build
        if: matrix.name != 'windows'
        shell: bash
        run: bash scripts/build.sh

      # The executable keeps the name the build gave it on every platform. What
      # says which version it is and where it came from is the zip around it,
      # which is also what keeps the executable bit through the download on macOS
      # and Linux. A file sitting in somebody's downloads folder a year later
      # still says which version it is. The Windows runner has 7-Zip and no zip,
      # the other two have zip.
      - name: Zip it under the version and the platform it was built on
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          mkdir out
          7z a "out\imgdedupe-${{ needs.check.outputs.version }}-${{ matrix.name }}.zip" "${{ matrix.built }}"

      - name: Zip it under the version and the platform it was built on
        if: matrix.name != 'windows'
        shell: bash
        run: |
          mkdir -p out
          zip -j "out/imgdedupe-${{ needs.check.outputs.version }}-${{ matrix.name }}.zip" "${{ matrix.built }}"

      - uses: actions/upload-artifact@v4
        with:
          name: imgdedupe-${{ needs.check.outputs.version }}-${{ matrix.name }}.zip
          path: out/imgdedupe-${{ needs.check.outputs.version }}-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    # A version is released once. The tag is created here and never moved, so a
    # tag that already exists fails the run, which is the right outcome: that
    # version has already been released.
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      - name: Tag the commit this was built from
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      # The `releases` branch holds nothing but builds: one directory per
      # version, named after it, holding that version's three archives. It has a
      # history of its own and shares no commit with the source, so a checkout of
      # main never carries megabytes of executables around with it.
      - name: Put the three of them on the releases branch
        env:
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin releases >/dev/null 2>&1; then
            git fetch origin releases
            git checkout releases
          else
            git checkout --orphan releases
            # Take the source out of the index and the tree, so the first commit
            # on this branch holds one version's builds and nothing else. The
            # archives are untracked at this point and are left where they are.
            git rm -rf --quiet .
          fi

          if [ -d "$VERSION" ]; then
            echo "$VERSION is already on the releases branch" >&2
            exit 1
          fi
          mkdir "$VERSION"
          mv built/*.zip "$VERSION"/
          ls -l "$VERSION"

          # The README is the list of what is on this branch, newest first, so
          # the new version goes in directly under the heading. A branch that
          # has none yet gets the heading first.
          #
          # The date is the day the tagged commit was made, not the day the
          # build ran: what is being dated is the version, and a rebuild of the
          # same commit is the same version.
          #
          # The checksum is beside each download because that is where somebody
          # checks it, against the file they have just fetched.
          if [ ! -f README.md ]; then
            printf '# imgdedupe releases\n' > README.md
          fi
          made_on=$(git log -1 --format=%cs "$GITHUB_SHA")
          sum() { sha256sum "$VERSION/imgdedupe-$VERSION-$1.zip" | cut -d' ' -f1; }
          {
            head -n 1 README.md
            printf '\n## %s (%s)\n\n' "$VERSION" "$made_on"
            printf -- '- [Windows](./%s/imgdedupe-%s-windows.zip) (sha256 %s)\n' \
              "$VERSION" "$VERSION" "$(sum windows)"
            printf -- '- [macOS](./%s/imgdedupe-%s-macos.zip) (sha256 %s)\n' \
              "$VERSION" "$VERSION" "$(sum macos)"
            printf -- '- [Linux](./%s/imgdedupe-%s-linux.zip) (sha256 %s)\n' \
              "$VERSION" "$VERSION" "$(sum linux)"
            printf -- '- [Source code](../../tree/%s)\n' "$TAG"
            tail -n +2 README.md
          } > README.next
          mv README.next README.md
          cat README.md

          git add "$VERSION" README.md
          git commit -m "$VERSION"
          git push origin releases
