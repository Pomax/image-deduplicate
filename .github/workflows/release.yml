name: Release

# Windows, macOS, and Linux build in parallel and their executables go into one
# release, named after the version in Cargo.toml. A push to main only builds and
# releases if that version changed since the previous commit. A v* tag always
# releases, under the tag name. Pull requests build but release nothing.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      # Two commits, so this commit's version can be compared to the one before.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether the version changed
        id: decide
        run: sh .github/workflows/check-version.sh

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            built: imgdedupe.exe
            asset: imgdedupe-windows.zip
          - os: macos-latest
            name: macos
            built: imgdedupe
            asset: imgdedupe-macos.zip
          - os: ubuntu-latest
            name: linux
            built: imgdedupe
            asset: imgdedupe-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The window is drawn with OpenGL through X11 and Wayland, and the file
      # dialog goes through the desktop portal, which needs none of GTK. These
      # are the headers those link against.
      - name: What Linux needs to build a window
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev upx-ucl

      # The build packs the executable when upx is on the path and leaves it
      # alone when it is not, so this failing is not a reason to stop.
      - name: Something to pack it with
        if: matrix.name == 'windows'
        continue-on-error: true
        run: choco install upx --no-progress --yes

      - name: Build
        if: matrix.name == 'windows'
        shell: cmd
        run: scripts\build.bat

      - name: Build
        if: matrix.name != 'windows'
        shell: bash
        run: bash scripts/build.sh

      # The executable keeps the name the build gave it on every platform. What
      # says where it came from is the zip around it, which is also what keeps
      # the executable bit through the download on macOS and Linux. The Windows
      # runner has 7-Zip and no zip, the other two have zip.
      - name: Zip it under the platform it was built on
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          mkdir out
          7z a "out\${{ matrix.asset }}" "${{ matrix.built }}"

      - name: Zip it under the platform it was built on
        if: matrix.name != 'windows'
        shell: bash
        run: |
          mkdir -p out
          zip -j "out/${{ matrix.asset }}" "${{ matrix.built }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    # The release is always created, never edited, so an existing release is
    # never changed or overwritten. If the tag already exists this fails, which
    # is the right outcome: that version has already been released.
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      # One release holding all three, made with the tool GitHub ships on its
      # own runners rather than somebody else's action.
      - name: Put the three of them out as one release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes \
            built/imgdedupe-windows.zip \
            built/imgdedupe-macos.zip \
            built/imgdedupe-linux.zip
