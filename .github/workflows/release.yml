name: Release

# The three platforms build at the same time and their executables go out as one
# release: a tag makes a release of its own, and a push to main replaces the one
# called latest. A pull request builds all three and releases nothing.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            built: imgdedupe.exe
            asset: imgdedupe-windows.zip
          - os: macos-latest
            name: macos
            built: imgdedupe
            asset: imgdedupe-macos.zip
          - os: ubuntu-latest
            name: linux
            built: imgdedupe
            asset: imgdedupe-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The window is drawn with OpenGL through X11 and Wayland, and the file
      # dialog goes through the desktop portal, which needs none of GTK. These
      # are the headers those link against.
      - name: What Linux needs to build a window
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev upx-ucl

      # The build packs the executable when upx is on the path and leaves it
      # alone when it is not, so this failing is not a reason to stop.
      - name: Something to pack it with
        if: matrix.name == 'windows'
        continue-on-error: true
        run: choco install upx --no-progress --yes

      - name: Build
        if: matrix.name == 'windows'
        shell: cmd
        run: scripts\build.bat

      - name: Build
        if: matrix.name != 'windows'
        shell: bash
        run: bash scripts/build.sh

      # The executable keeps the name the build gave it on every platform. What
      # says where it came from is the zip around it, which is also what keeps
      # the executable bit through the download on macOS and Linux. The Windows
      # runner has 7-Zip and no zip, the other two have zip.
      - name: Zip it under the platform it was built on
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          mkdir out
          7z a "out\${{ matrix.asset }}" "${{ matrix.built }}"

      - name: Zip it under the platform it was built on
        if: matrix.name != 'windows'
        shell: bash
        run: |
          mkdir -p out
          zip -j "out/${{ matrix.asset }}" "${{ matrix.built }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    # A tag makes a release of its own. A push to main replaces the one called
    # latest, so the newest build of all three platforms is always downloadable
    # without waiting for somebody to tag something.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      # One release holding all three, made with the tool GitHub ships on its
      # own runners rather than somebody else's action.
      - name: Put the three of them out as one release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            title="$tag"
          else
            tag="latest"
            title="Latest build of main"
          fi

          # Made once and replaced afterwards, so the three assets of a release
          # are always from one build rather than from whichever job last
          # finished.
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            # A release that already exists keeps the tag it was made from, and
            # editing its target does not move that tag, so latest would go on
            # pointing at whatever it was first made from. The tag is moved.
            if [ "$tag" = "latest" ]; then
              gh api -X PATCH "repos/$REPO/git/refs/tags/latest" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
            gh release edit "$tag" --repo "$REPO" --target "$GITHUB_SHA" --title "$title"
          else
            gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "$title" --generate-notes
          fi

          gh release upload "$tag" --repo "$REPO" --clobber \
            built/imgdedupe-windows.zip \
            built/imgdedupe-macos.zip \
            built/imgdedupe-linux.zip

          # Uploading replaces an asset of the same name and leaves every other
          # one where it is, so a release that has been made before still holds
          # what earlier runs called things. A release holds these three.
          gh release view "$tag" --repo "$REPO" --json assets \
            --jq '.assets[].name' |
          while read -r asset; do
            case "$asset" in
              imgdedupe-windows.zip|imgdedupe-macos.zip|imgdedupe-linux.zip) ;;
              *) gh release delete-asset "$tag" "$asset" --repo "$REPO" --yes ;;
            esac
          done
